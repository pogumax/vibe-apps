<title>Max Pog Apps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a short shelf of small tools, one row each. */
:root {
  --bg: #ECEFF4; --paper: #FAFBFD; --ink: #151A25; --muted: #5E6678; --line: #D3D8E2; --danger: #DB1F2A;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E121A; --paper: #141924; --ink: #E5E8EF; --muted: #8B94A7; --line: #262E3F; --danger: #FF3B45; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E121A; --paper: #141924; --ink: #E5E8EF; --muted: #8B94A7; --line: #262E3F; --danger: #FF3B45; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); }
main {
  max-width: 760px; margin: 0 auto; padding-block: 56px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 6vw, 48px); letter-spacing: -.02em; margin: 0; }
h1 em { font-style: normal; color: var(--danger); }
p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li { border-bottom: 1px solid var(--line); }
a.app { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 18px 4px; color: inherit; text-decoration: none; }
a.app:hover b, a.app:focus-visible b { color: var(--danger); }
a.app b { font-family: var(--font-display); font-weight: 500; font-size: 20px; }
a.app span { color: var(--muted); font-size: 14px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>

<!-- body -->
<main>
  <h1>Max Pog <em>apps</em></h1>
  <p>Small tools I build for myself. Free to use, nothing to install.</p>
  <ul>
    <li><a class="app" href="/nonstop/"><b>Don't Stop Writing</b><span>timed nonstop writing for brainstorms</span></a></li>
  </ul>
</main>
